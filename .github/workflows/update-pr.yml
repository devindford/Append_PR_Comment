name: "Update Pull Request Body"

on: 
  workflow_call:
    inputs:
      pull-request:
        description: overide pull request number
        required: true
        type: string

jobs:
  update_pr:
    runs-on: ubuntu-latest
    outputs:
      headMatch: ${{ steps.update_pr.outputs.headMatch }}
      bodyUpdated: ${{ steps.update_pr.outputs.bodyUpdated }}
    steps:
      - id: update_pr
        uses: rmcnamara/pr-update-action@context-parameters
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          body-template: "Updated by PR action 👽"
          
  update_pr_outputs:
    runs-on: ubuntu-latest
    needs: update_pr
    steps:
      - run: |
          echo 'bodyUpdated:' ${{needs.update_pr.outputs.bodyUpdated}}
